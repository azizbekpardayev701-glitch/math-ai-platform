<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matematika AI Platformasi</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-between p-4">

    <!-- Asosiy konteyner -->
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl flex flex-col h-[85vh] p-4">
        <h1 class="text-xl font-bold text-emerald-400 text-center mb-1">Matematika AI Platformasi</h1>
        <p class="text-xs text-slate-400 text-center mb-4">Milliy Sertifikat va SAT imtihonlariga tayyorgarlik</p>

        <!-- Chat qismi -->
        <div id="chatBox" class="flex-1 bg-slate-950/50 border border-slate-800 rounded-xl p-3 overflow-y-auto space-y-3 mb-3">
            <div class="bg-emerald-950/40 border border-emerald-800/50 text-emerald-200 p-3 rounded-lg text-sm max-w-[85%]">
                <b>Al Ustoz:</b> Assalomu alaykum! Matematikadan qanday savol yoki masalangiz bor? Yozing, birgalikda tahlil qilamiz.
            </div>
        </div>

        <!-- Pastdagi yozish sohasi -->
        <div class="flex gap-2">
            <input type="text" id="inputField" placeholder="Masalangizni yozing..." 
                class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
            <button onclick="solveMath()" 
                class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium px-5 py-2.5 rounded-xl text-sm transition-all shadow-lg shadow-emerald-900/30">
                Yuborish
            </button>
        </div>
    </div>

    <footer class="mt-4 text-center text-xs text-slate-500">
        &copy; 2026 Matematika AI Platformasi. Barcha huquqlar himoyalangan.
    </footer>

    <script>
        function solveMath() {
            const inputField = document.getElementById("inputField");
            const chatBox = document.getElementById("chatBox");
            const promptText = inputField.value.trim();

            if (!promptText) return;

            // Foydalanuvchi xabarini chiqarish
            chatBox.innerHTML += `<div class="bg-slate-800 text-slate-100 p-3 rounded-lg text-sm max-w-[85%] ml-auto">${escapeHtml(promptText)}</div>`;
            inputField.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            // Yuklanmoqda xabari
            const loadingId = "loading_" + Date.now();
            chatBox.innerHTML += `<div id="${loadingId}" class="bg-emerald-950/20 border border-emerald-900/30 text-emerald-400 p-3 rounded-lg text-sm max-w-[85%] animate-pulse"><b>Al Ustoz:</b> Hisoblamoqdaman...</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            setTimeout(() => {
                document.getElementById(loadingId).remove();
                
                let resultText = "";
                let numbers = promptText.match(/\d+/g);

                if (numbers && numbers.length >= 2) {
                    let a = parseInt(numbers[0]);
                    let b = parseInt(numbers[1]);
                    
                    if (promptText.toLowerCase().includes("qoʻsh") || promptText.toLowerCase().includes("qosh") || promptText.toLowerCase().includes("va")) {
                        let sum = a + b;
                        resultText = `<b>Al Ustoz:</b><br><b>Yechim:</b><br>1. Berilgan sonlar: ${a} va ${b}<br>2. Qo'shish amali bajariladi: ${a} + ${b}<br>3. <b>Natija:</b> ${sum}`;
                    } else {
                        // Odatiy ayirish (olma yedi, qoldi kabi)
                        let diff = a - b;
                        resultText = `<b>Al Ustoz:</b><br><b>Yechim:</b><br>1. Boshlang'ich miqdor: ${a}<br>2. Ayiriladigan miqdor: ${b}<br>3. Hisob-kitob: ${a} - ${b} = ${diff}<br><b>Javob: ${diff}</b>`;
                    }
                } else {
                    resultText = `<b>Al Ustoz:</b><br>"<b>${escapeHtml(promptText)}</b>" bo'yicha tahlil:<br>Iltimos, masalani aniqroq raqamlar bilan kiriting (masalan: "10 ta olma bor edi 3 tasi yeyildi").`;
                }

                chatBox.innerHTML += `<div class="bg-emerald-950/40 border border-emerald-800/50 text-emerald-200 p-3 rounded-lg text-sm max-w-[85%] whitespace-pre-wrap">${resultText}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 600);
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        document.getElementById("inputField").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                solveMath();
            }
        });
    </script>
</body>
</html>
