<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matematika AI Platformasi</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-between p-4">

    <!-- Asosiy konteyner -->
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl flex flex-col h-[85vh] p-4">
        <h1 class="text-xl font-bold text-emerald-400 text-center mb-1">Matematika AI Platformasi</h1>
        <p class="text-xs text-slate-400 text-center mb-4">Milliy Sertifikat va SAT imtihonlariga tayyorgarlik</p>

        <!-- Chat qismi -->
        <div id="chatBox" class="flex-1 bg-slate-950/50 border border-slate-800 rounded-xl p-3 overflow-y-auto space-y-3 mb-3">
            <div class="bg-emerald-950/40 border border-emerald-800/50 text-emerald-200 p-3 rounded-lg text-sm max-w-[85%]">
                <b>Al Ustoz:</b> Assalomu alaykum! Matnli masalani yozing yoki rasmga olib yuklang. To'liq va qadamba-qadam tushuntirib beraman.
            </div>
        </div>

        <!-- Pastdagi yozish va rasm yuklash sohasi -->
        <div class="flex gap-2 items-center">
            <label class="bg-slate-800 hover:bg-slate-700 text-emerald-400 p-2.5 rounded-xl cursor-pointer transition-all border border-slate-700 flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
                <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
            </label>

            <input type="text" id="inputField" placeholder="Masalangizni yozing..." 
                class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
            
            <button onclick="sendMessage()" 
                class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium px-4 py-2.5 rounded-xl text-sm transition-all shadow-lg shadow-emerald-900/30">
                Yuborish
            </button>
        </div>
    </div>

    <footer class="mt-4 text-center text-xs text-slate-500">
        &copy; 2026 Matematika AI Platformasi. Barcha huquqlar himoyalangan.
    </footer>

    <script>
        // API KALITINGIZNI SHU YERGA YOZING:
        const API_KEY = "O'zingizning_API_kalitingizni_shu_yerga_qo'yasiz";

        let currentImageBase64 = null;
        let currentMimeType = "image/jpeg";

        function sendMessage() {
            const inputField = document.getElementById("inputField");
            const chatBox = document.getElementById("chatBox");
            const text = inputField.value.trim();

            if (!text && !currentImageBase64) return;

            let userHtml = `<div class="bg-slate-800 text-slate-100 p-3 rounded-lg text-sm max-w-[85%] ml-auto space-y-2">`;
            if (currentImageBase64) {
                userHtml += `<img src="${currentImageBase64}" class="rounded-lg max-h-40 object-cover w-full">`;
            }
            if (text) {
                userHtml += `<div>${escapeHtml(text)}</div>`;
            }
            userHtml += `</div>`;
            chatBox.innerHTML += userHtml;

            inputField.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            callGeminiAPI(text, currentImageBase64, currentMimeType);
            currentImageBase64 = null;
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            currentMimeType = file.type;
            const reader = new FileReader();
            reader.onload = function(e) {
                currentImageBase64 = e.target.result;
                const chatBox = document.getElementById("chatBox");
                chatBox.innerHTML += `<div class="bg-slate-800 text-slate-100 p-2 rounded-lg text-sm max-w-[85%] ml-auto"><img src="${currentImageBase64}" class="rounded-lg max-h-40 object-cover"><b>[Rasm yuklandi. Savolingizni yozib yuboring]</b></div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            };
            reader.readAsDataURL(file);
        }

        async function callGeminiAPI(userText, imageB64, mimeType) {
            const chatBox = document.getElementById("chatBox");
            const loadingId = "loading_" + Date.now();
            
            chatBox.innerHTML += `<div id="${loadingId}" class="bg-emerald-950/20 border border-emerald-900/30 text-emerald-400 p-3 rounded-lg text-sm max-w-[85%] animate-pulse"><b>Al Ustoz:</b> Masala tahlil qilinmoqda...</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                let contents = [];
                let parts = [];

                let systemInstruction = "Siz tajribali matematika o'qituvchisisiz. Foydalanuvchi yuborgan istalgan murakkab matnli masalani yoki rasmdagi shartni imlo xatolariga qaramasdan mukammal tushunib, o'zbek tilida qadamba-qadam, formulalar va mantiqiy asoslar bilan to'liq yechib bering.";

                if (userText) {
                    parts.push({ text: systemInstruction + " Masala sharti: " + userText });
                } else {
                    parts.push({ text: systemInstruction + " Iltimos, ushbu rasmdagi masalani diqqat bilan o'qib chiqib, qadamba-qadam yechib bering." });
                }

                if (imageB64) {
                    let base64Data = imageB64.split(",")[1];
                    parts.push({
                        inline_data: {
                            mime_type: mimeType,
                            data: base64Data
                        }
                    });
                }

                contents.push({ parts: parts });

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: contents })
                });

                const data = await response.json();
                document.getElementById(loadingId).remove();

                if (data.candidates && data.candidates[0].content) {
                    let replyText = data.candidates[0].content.parts[0].text;
                    let formattedReply = escapeHtml(replyText).replace(/\n/g, '<br>');

                    chatBox.innerHTML += `<div class="bg-emerald-950/40 border border-emerald-800/50 text-emerald-200 p-3 rounded-lg text-sm max-w-[85%] whitespace-pre-wrap"><b>Al Ustoz:</b><br>${formattedReply}</div>`;
                } else {
                    chatBox.innerHTML += `<div class="bg-red-950/40 border border-red-800/50 text-red-200 p-3 rounded-lg text-sm max-w-[85%]">Javob olishda xatolik yuz berdi. API kalitingizni tekshiring.</div>`;
                }

                chatBox.scrollTop = chatBox.scrollHeight;

            } catch (error) {
                document.getElementById(loadingId).remove();
                chatBox.innerHTML += `<div class="bg-red-950/40 border border-red-800/50 text-red-200 p-3 rounded-lg text-sm max-w-[85%]">Tarmoqda xatolik yuz berdi.</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        document.getElementById("inputField").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        });
    </script>
</body>
</html>
