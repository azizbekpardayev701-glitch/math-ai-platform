<!DOCTYPE html>
<html lang="uz">
<head>

  <title>Milliy Sertifikat & SAT Matematika AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between p-4">

  <div class="max-w-2xl w-full mx-auto bg-slate-800 rounded-xl p-6 shadow-xl border border-slate-700 my-auto">

      <button class="bg-emerald-500 hover:bg-emerald-600 text-slate-900 font-bold px-6 py-3 rounded-lg transition-colors">
        Yuborish
      </button>
    </div>
  </div>

  <footer class="text-center text-slate-500 text-sm py-4">
    © 2026 Matematika AI Platformasi. Barcha huquqlar himoyalangan.
