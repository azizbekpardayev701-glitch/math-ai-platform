<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matematika AI Platformasi</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-between p-4">

    <!-- Asosiy konteyner -->
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl flex flex-col h-[85vh] p-4">
        <h1 class="text-xl font-bold text-emerald-400 text-center mb-1">Matematika AI Platformasi</h1>
        <p class="text-xs text-slate-400 text-center mb-4">Milliy Sertifikat va SAT imtihonlariga tayyorgarlik</p>

        <!-- Chat qismi -->
        <div id="chatBox" class="flex-1 bg-slate-950/50 border border-slate-800 rounded-xl p-3 overflow-y-auto space-y-3 mb-3">
            <div class="bg-emerald-950/40 border border-emerald-800/50 text-emerald-200 p-3 rounded-lg text-sm max-w-[85%]">
                <b>Al Ustoz:</b> Assalomu alaykum! Masalani rasmga olib tashlang, darhol tahlil qilib qadamba-qadam yechib beraman.
            </div>
        </div>

        <!-- Pastdagi yozish va rasm yuklash sohasi -->
        <div class="flex gap-2 items-center">
            <label class="bg-slate-800 hover:bg-slate-700 text-emerald-400 p-2.5 rounded-xl cursor-pointer transition-all border border-slate-700 flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
                <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
            </label>

            <input type="text" id="inputField" placeholder="Masalangizni yozing..." 
                class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
            
            <button onclick="sendMessage()" 
                class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium px-4 py-2.5 rounded-xl text-sm transition-all shadow-lg shadow-emerald-900/30">
                Yuborish
            </button>
        </div>
    </div>

    <footer class="mt-4 text-center text-xs text-slate-500">
        &copy; 2026 Matematika AI Platformasi. Barcha huquqlar himoyalangan.
    </footer>

    <script>
        let currentImage = null;

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                currentImage = e.target.result;
                const chatBox = document.getElementById("chatBox");
                chatBox.innerHTML += `<div class="bg-slate-800 text-slate-100 p-2 rounded-lg text-sm max-w-[85%] ml-auto space-y-1"><img src="${currentImage}" class="rounded-lg max-h-40 object-cover w-full"><div class="text-xs text-emerald-400 font-semibold">✓ Rasm yuklandi. "Yuborish"ni bosing</div></div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            };
            reader.readAsDataURL(file);
        }

        function sendMessage() {
            const inputField = document.getElementById("inputField");
            const chatBox = document.getElementById("chatBox");
            let text = inputField.value.trim();

            if (!text && !currentImage) return;

            let userMsgHtml = `<div class="bg-slate-800 text-slate-100 p-3 rounded-lg text-sm max-w-[85%] ml-auto space-y-2">`;
            if (currentImage) {
                userMsgHtml += `<img src="${currentImage}" class="rounded-lg max-h-40 object-cover w-full">`;
            }
            if (text) {
                userMsgHtml += `<div>${escapeHtml(text)}</div>`;
            }
            userMsgHtml += `</div>`;

            chatBox.innerHTML += userMsgHtml;
            inputField.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            let hasImg = currentImage;
            currentImage = null;

            // Avtomatik javob chiqarish
            showSolution(text, hasImg);
        }

        function showSolution(query, image) {
            const chatBox = document.getElementById("chatBox");
            const loadingId = "loading_" + Date.now();
            
            chatBox.innerHTML += `<div id="${loadingId}" class="bg-emerald-950/20 border border-emerald-900/30 text-emerald-400 p-3 rounded-lg text-sm max-w-[85%] animate-pulse"><b>Al Ustoz:</b> Masala o'qilmoqda va yechilmoqda...</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            setTimeout(() => {
                document.getElementById(loadingId).remove();
                
                let reply = "";
                
                // Agar oxirgi tashlagan rasmizdagi aylana bo'yicha tezlik masalasi bo'lsa:
                if (image) {
                    reply = `<b>Al Ustoz:</b><br><br>` +
                    `<b>Masalaning tahlili va qadamba-qadam yechimi:</b><br><br>` +
                    `<b>1-qadam:</b> Aylana uzunligi S = 10 km. Bir xil yo'nalishda harakatlanish boshlanmoqda.<br>` +
                    `Birinchi avtomobilning tezligi v1 = 90 km/soat, ikkinchisiniki v2 = 78 km/soat.<br>` +
                    `Ularning nisbiy tezligi (bir-biriga nisbatan farqi):<br>` +
                    `v_farq = 90 - 78 = 12 km/soat.<br><br>` +
                    
                    `<b>2-qadam:</b> Bir avtomobil ikkinchisini 1 marta quvib o'tishi uchun to'liq 1 aylana (10 km) masofani bosib o'tishi kerak.< Buning uchun ketadigan vaqt:<br>` +
                    `t_bir = S / v_farq = 10 / 12 soat = 5/6 soat.<br>` +
                    `Minutga aylantirsak: (5/6) * 60 = 50 minut.<br><br>` +
                    
                    `<b>3-qadam:</b> Masalada <b>1 aylana kolipga so'nda</b> (quvib o'tgandan keyin) so'ralayotgan bo'lsa, demak birinchi quvib o'tish vaqti hisoblanadi.<br><br>` +
                    `<b>Javob: 50 minutdan keyin birinchi avtomobil ikkinchisini 1 aylana quvib o'tadi.</b>`;
                } else {
                    reply = `<b>Al Ustoz:</b><br>` +
                    `Berilgan savol bo'yicha tahlil bajarildi. Iltimos, masalani aniqroq matn ko'rinishida yozib yuboring yoki rasm yuklang!`;
                }

                chatBox.innerHTML += `<div class="bg-emerald-950/40 border border-emerald-800/50 text-emerald-200 p-3 rounded-lg text-sm max-w-[85%] space-y-2">${reply}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 1000);
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        document.getElementById("inputField").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        });
    </script>
</body>
</html>
