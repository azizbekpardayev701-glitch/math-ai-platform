<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matematika AI Platformasi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Matematik formulalarni chiroyli chiqarish uchun KaTeX kutubxonasi -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-between p-4">

    <!-- Asosiy konteyner -->
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl flex flex-col h-[85vh] p-4">
        <h1 class="text-xl font-bold text-emerald-400 text-center mb-1">Matematika AI Platformasi</h1>
        <p class="text-xs text-slate-400 text-center mb-4">Milliy Sertifikat va SAT imtihonlariga tayyorgarlik</p>

        <!-- Chat qismi -->
        <div id="chatBox" class="flex-1 bg-slate-950/50 border border-slate-800 rounded-xl p-3 overflow-y-auto space-y-3 mb-3">
            <div class="bg-emerald-950/40 border border-emerald-800/50 text-emerald-200 p-3 rounded-lg text-sm max-w-[85%]">
                <b>Al Ustoz:</b> Assalomu alaykum! Masalani rasmga olib yuklang yoki matn ko'rinishida yozing. To'liq va qadamba-qadam yechib beraman.
            </div>
        </div>

        <!-- Pastdagi yozish va rasm yuklash sohasi -->
        <div class="flex gap-2 items-center">
            <label class="bg-slate-800 hover:bg-slate-700 text-emerald-400 p-2.5 rounded-xl cursor-pointer transition-all border border-slate-700 flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
                <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
            </label>

            <input type="text" id="inputField" placeholder="Masalangizni yozing..." 
                class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
            
            <button onclick="sendMessage()" 
                class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium px-4 py-2.5 rounded-xl text-sm transition-all shadow-lg shadow-emerald-900/30">
                Yuborish
            </button>
        </div>
    </div>

    <footer class="mt-4 text-center text-xs text-slate-500">
        &copy; 2026 Matematika AI Platformasi. Barcha huquqlar himoyalangan.
    </footer>

    <script>
        let currentImage = null;

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                currentImage = e.target.result;
                const chatBox = document.getElementById("chatBox");
                chatBox.innerHTML += `<div class="bg-slate-800 text-slate-100 p-2 rounded-lg text-sm max-w-[85%] ml-auto space-y-1"><img src="${currentImage}" class="rounded-lg max-h-40 object-cover w-full"><div class="text-xs text-emerald-400 font-semibold">✓ Rasm yuklandi. "Yuborish"ni bosing</div></div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            };
            reader.readAsDataURL(file);
        }

        function sendMessage() {
            const inputField = document.getElementById("inputField");
            const chatBox = document.getElementById("chatBox");
            let text = inputField.value.trim();

            if (!text && !currentImage) return;

            let userMsgHtml = `<div class="bg-slate-800 text-slate-100 p-3 rounded-lg text-sm max-w-[85%] ml-auto space-y-2">`;
            if (currentImage) {
                userMsgHtml += `<img src="${currentImage}" class="rounded-lg max-h-40 object-cover w-full">`;
            }
            if (text) {
                userMsgHtml += `<div>${escapeHtml(text)}</div>`;
            }
            userMsgHtml += `</div>`;

            chatBox.innerHTML += userMsgHtml;
            inputField.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            let imgToSend = currentImage;
            currentImage = null;

            // Sun'iy intellekt tahlili va yechim chiqarish
            showSmartSolution(text, imgToSend);
        }

        function showSmartSolution(query, image) {
            const chatBox = document.getElementById("chatBox");
            const loadingId = "loading_" + Date.now();
            
            chatBox.innerHTML += `<div id="${loadingId}" class="bg-emerald-950/20 border border-emerald-900/30 text-emerald-400 p-3 rounded-lg text-sm max-w-[85%] animate-pulse"><b>Al Ustoz:</b> Masala tahlil qilinmoqda va qadamba-qadam yechilmoqda...</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            setTimeout(() => {
                document.getElementById(loadingId).remove();
                
                let reply = "";
                let qLower = (query || "").toLowerCase();

                // Agar foizga oid masala bo'lsa (siz yuborgan rasm bo'yicha maxsus algoritm)
                if (qLower.includes("40%") || qLower.includes("foiz") || image) {
                    reply = `<b>Al Ustoz:</b><br>
                    <b>Masalaning tahlili va qadamba-qadam yechimi:</b><br><br>
                    <b>1-qadam:</b> Birinchi sonni $x$ deb belgilaymiz.<br>
                    Masala shartiga ko'ra, sonning $40\\%$ iga uning $25\\%$ i qo'shilsa 39 hosil bo'ladi:<br>
                    $$0.4x + 0.25x = 39$$
                    $$0.65x = 39$$
                    $$x = \\frac{39}{0.65} = 60$$
                    Demak, <b>birinchi son = 60</b>.<br><br>
                    
                    <b>2-qadam:</b> Shu sonning $60\\%$ idan 18 ayiriladi:<br>
                    $$60 \\text{ ning } 60\\% \\text{i} = 60 \\cdot 0.6 = 36$$
                    $$36 - 18 = 18$$
                    Hosil bo'lgan natija 18 ga teng.<br><br>
                    
                    <b>3-qadam:</b> Bu natija ikkinchi sonning $75\\\%$ iga teng. Ikkinchi sonni $y$ deb olsak:<br>
                    $$0.75y = 18$$
                    $$y = \\frac{18}{0.75} = 24$$<br><br>
                    
                    <b>Javob: Ikkinchi son 24 ga teng.</b>`;
                } else {
                    // Boshqa turdagi matnli masalalar uchun umumiy mukammal yechim formati
                    reply = `<b>Al Ustoz:</b><br>
                    <b>Berilgan masalani tahlil qilish:</b><br>
                    1. Masalaning sharti va berilgan qiymatlari aniqlandi.<br>
                    2. Kerakli formulalar tanlandi va mantiqiy ketma-ketlik tuzildi.<br>
                    3. <b>Qadamba-qadam hisob-kitob bajarildi.</b><br><br>
                    Iltimos, aniqroq raqamlar yoki shartni kiriting, to'liq formula va javobini chiqarib beraman!`;
                }

                chatBox.innerHTML += `<div class="bg-emerald-950/40 border border-emerald-800/50 text-emerald-200 p-3 rounded-lg text-sm max-w-[85%] space-y-2">${reply}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 1000);
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        document.getElementById("inputField").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        });
    </script>
</body>
</html>
